<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Airspace Ops Simulator architecture</title>
  <desc id="desc">JavaFX interface connected to the simulation controller, two blocking queues, and independent worker groups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="1" stop-color="#e8f3f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#113244" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#147d92"/>
    </marker>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="70" fill="#103444" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="800">One interface, two queues, independent workers</text>
  <text x="72" y="104" fill="#52727f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Lifecycle ownership stays central while concurrent work remains isolated by responsibility.</text>

  <g transform="translate(72 152)" filter="url(#shadow)">
    <rect width="320" height="470" rx="24" fill="#123c4c"/>
    <circle cx="45" cy="46" r="21" fill="#6ee7f2"/>
    <path d="M34 46 H56 M45 35 V57" stroke="#123c4c" stroke-width="4" stroke-linecap="round"/>
    <text x="82" y="54" fill="#f5fcfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="750">JavaFX interface</text>
    <text x="28" y="92" fill="#a9cad5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">APPLICATION THREAD</text>

    <rect x="28" y="122" width="264" height="86" rx="15" fill="#1d5363"/>
    <text x="48" y="153" fill="#8ee9f1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">CONFIGURATION</text>
    <text x="48" y="182" fill="#edf9fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Grid · airports · fleet · speed</text>

    <rect x="28" y="228" width="264" height="86" rx="15" fill="#1d5363"/>
    <text x="48" y="259" fill="#8ee9f1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">LIVE GRID</text>
    <text x="48" y="288" fill="#edf9fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Airports, routes, aircraft motion</text>

    <rect x="28" y="334" width="264" height="86" rx="15" fill="#1d5363"/>
    <text x="48" y="365" fill="#8ee9f1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">OPERATIONS VIEW</text>
    <text x="48" y="394" fill="#edf9fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Counters and chronological events</text>
  </g>

  <path d="M392 300 H454" fill="none" stroke="#147d92" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(462 152)" filter="url(#shadow)">
    <rect width="420" height="470" rx="24" fill="#ffffff" stroke="#b8d2da"/>
    <text x="30" y="52" fill="#103444" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">SimulationController</text>
    <text x="30" y="80" fill="#67838d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Single lifecycle and coordination boundary</text>

    <rect x="30" y="110" width="360" height="82" rx="15" fill="#e2f6f7" stroke="#8dcfd5"/>
    <text x="52" y="141" fill="#11606e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750">DOMAIN STATE</text>
    <text x="52" y="169" fill="#173f4c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Airports · aircraft · atomic counters</text>

    <rect x="30" y="218" width="360" height="82" rx="15" fill="#e9f2ff" stroke="#a6c6eb"/>
    <circle cx="62" cy="259" r="14" fill="#2f80c0"/>
    <text x="62" y="264" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">1</text>
    <text x="88" y="250" fill="#255479" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750">FLIGHT REQUEST QUEUE</text>
    <text x="88" y="276" fill="#3e617b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Routes waiting for an aircraft</text>

    <rect x="30" y="326" width="360" height="82" rx="15" fill="#fff2dc" stroke="#edca89"/>
    <circle cx="62" cy="367" r="14" fill="#c77b15"/>
    <text x="62" y="372" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">2</text>
    <text x="88" y="358" fill="#875817" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750">SERVICE QUEUE</text>
    <text x="88" y="384" fill="#765e39" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Landed aircraft awaiting turnaround</text>
  </g>

  <path d="M952 307 C920 307, 930 386, 888 390" fill="none" stroke="#147d92" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M882 432 H944" fill="none" stroke="#147d92" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M882 519 H944" fill="none" stroke="#147d92" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(952 152)" filter="url(#shadow)">
    <rect width="416" height="470" rx="24" fill="#ffffff" stroke="#b8d2da"/>
    <text x="30" y="52" fill="#103444" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Concurrent workers</text>
    <text x="30" y="80" fill="#67838d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Independent pools with explicit duties</text>

    <rect x="30" y="110" width="356" height="90" rx="15" fill="#e2f6f7" stroke="#8dcfd5"/>
    <text x="52" y="142" fill="#11606e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750">REQUEST SOURCES</text>
    <text x="52" y="170" fill="#173f4c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">One producer per airport</text>

    <rect x="30" y="220" width="356" height="90" rx="15" fill="#e9f2ff" stroke="#a6c6eb"/>
    <text x="52" y="252" fill="#255479" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750">FLIGHT OPERATIONS</text>
    <text x="52" y="280" fill="#3e617b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Dispatch, movement, and arrival</text>

    <rect x="30" y="330" width="356" height="90" rx="15" fill="#fff2dc" stroke="#edca89"/>
    <text x="52" y="362" fill="#875817" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750">SERVICE WORKERS</text>
    <text x="52" y="390" fill="#765e39" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Five reusable turnaround workers</text>
  </g>

  <rect x="72" y="664" width="1296" height="48" rx="24" fill="#123c4c"/>
  <text x="720" y="694" text-anchor="middle" fill="#dff8fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">Background workers publish UI changes through Platform.runLater · shutdown has one five-second deadline</text>
</svg>
