name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: airspace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify the project
        run: ./gradlew --no-daemon clean check

      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: airspace-pmd-reports
          path: |
            comms/build/reports/pmd/
            gui/build/reports/pmd/
          if-no-files-found: warn
          retention-days: 14
